openapi: 3.0.3
info:
  title: Địa Thế — Bản đồ (Vietmap)
  version: 0.1.0
  description: |
    Tiền tố `/api/v1`. Phản hồi bọc trong envelope chung `{success,status,data,error}`; lỗi nghiệp vụ có `error.details.code`.
    Phân quyền: `map:use` (người dùng đã đăng nhập, gồm admin); `admin:access` cho `/admin/map/usage`.
    Khóa Vietmap không bao giờ xuất hiện trong request/response (trừ style URL ở /map/config có khóa Tilemap).
paths:
  /map/config:
    get:
      summary: Cấu hình bản đồ cho client
      x-permission: map:use
      x-rate-limit: 30/phút/người dùng
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MapConfig" } } } }
        "401": { description: Chưa đăng nhập }
        "403": { description: Không có map:use }
  /map/search:
    get:
      summary: Gợi ý địa điểm (Autocomplete v4)
      x-permission: map:use
      x-rate-limit: 90/phút/người dùng
      parameters:
        - { name: text, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { name: lat, in: query, schema: { type: number, minimum: 8, maximum: 24 }, description: Tâm ưu tiên (focus); mặc định Hà Nội }
        - { name: lng, in: query, schema: { type: number, minimum: 102, maximum: 110 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 8 } }
        - { name: cats, in: query, schema: { type: string, pattern: '^\d{1,6}(-\d{1,3})?(,\d{1,6}(-\d{1,3})?){0,9}$' }, description: Mã nhóm POI }
        - { name: scope, in: query, schema: { type: string, example: "POI,STREET" }, description: "Tập con của POI,ADDRESS,VILLAGE,WARD,DIST,CITY,STREET (Vietmap: layers)" }
        - { name: cityId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: distId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: wardId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: radius, in: query, schema: { type: integer, minimum: 50, maximum: 50000 }, description: Mét quanh (lat,lng) }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MapSuggestion" } } } } }
        "400": { description: Đầu vào sai schema (VALIDATION_ERROR) }
        "429": { description: Vượt giới hạn người dùng (details.retryAfter) }
        "503": { description: Hết ngân sách ngày / upstream lỗi / cầu dao mở }
  /map/places/resolve:
    get:
      summary: ref_id → tọa độ (Place v4)
      x-permission: map:use
      x-rate-limit: 30/phút/người dùng
      parameters:
        - { name: refId, in: query, required: true, schema: { type: string, maxLength: 1500, pattern: '^[A-Za-z0-9_:.-]+$' } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MapPlace" } } } }
        "404": { description: ref_id không còn hợp lệ }
  /map/reverse:
    get:
      summary: Tọa độ → địa chỉ (Reverse v4)
      x-permission: map:use
      x-rate-limit: 30/phút/người dùng
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: 8, maximum: 24 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: 102, maximum: 110 } }
      responses:
        "200": { description: OK; null nếu không có địa chỉ gần, content: { application/json: { schema: { $ref: "#/components/schemas/MapPlace" } } } }
  /map/route:
    get:
      summary: Tìm đường (Route v4)
      x-permission: map:use
      x-rate-limit: 20/phút/người dùng
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, example: "21.0285,105.8542" }, description: "lat,lng" }
        - { name: to, in: query, required: true, schema: { type: string, example: "21.0045,105.8430" }, description: "lat,lng" }
        - { name: vehicle, in: query, schema: { type: string, enum: [car, motorcycle], default: motorcycle } }
        - { name: alternatives, in: query, schema: { type: boolean, default: false } }
        - { name: avoid, in: query, schema: { type: string, enum: [ferry] } }
        - { name: time, in: query, schema: { type: string, example: "2026-11-03T01:00:00Z" }, description: Giờ khởi hành ISO 8601 UTC; làm tròn xuống 15 phút }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MapRoute" } } } } }
        "404": { description: Không tìm được đường }
        "422": { description: Tọa độ ngoài Việt Nam hoặc điểm đi trùng điểm đến }
  /admin/map/usage:
    get:
      summary: Bộ đếm hôm nay (gọi upstream, cache hit) và ngân sách
      x-permission: admin:access
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MapUsage" } } } }
  /map/saved:
    get:
      summary: Địa điểm đã lưu của người dùng (mới nhất trước, tối đa 200)
      x-permission: map:use
      x-rate-limit: 60/phút/người dùng (nhóm saved)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SavedPlace" } } } } }
    post:
      summary: Lưu địa điểm (idempotent theo tọa độ làm tròn 5 chữ số)
      x-permission: map:use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng, name]
              properties:
                lat: { type: number, minimum: 8, maximum: 24 }
                lng: { type: number, minimum: 102, maximum: 110 }
                name: { type: string, minLength: 1, maxLength: 200 }
                address: { type: string, maxLength: 300 }
                kind: { type: string, enum: [poi, address, street, ward, district, city, village, unknown] }
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SavedPlace" } } } }
        "409": { description: Đã lưu tối đa 200 địa điểm (limit_reached) }
  /map/saved/{id}:
    patch:
      summary: Tên gợi nhớ, ghi chú, bật/tắt so sánh (chỉ mục của chính mình)
      x-permission: map:use
      x-rate-limit: 60/phút/người dùng (nhóm saved)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, nullable: true, maxLength: 80, description: "null hoặc rỗng = dùng tên gốc" }
                note: { type: string, maxLength: 1000 }
                compared: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SavedPlace" } } } }
        "400": { description: Trường lạ hoặc quá dài }
        "404": { description: Không có hoặc không thuộc người dùng }
        "409": { description: Đã so sánh tối đa 6 địa điểm (limit_reached) }
    delete:
      summary: Bỏ lưu
      x-permission: map:use
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "404": { description: Không có hoặc không thuộc người dùng }
  /map/compare:
    get:
      summary: Mục đã lưu đang so sánh (thứ tự thêm, tối đa 6) kèm đánh giá đầy đủ từ lượt gần nhất của CHÍNH người dùng (null nếu chưa)
      x-permission: map:use
      x-rate-limit: 60/phút/người dùng (nhóm saved)
      responses:
        "200": { description: "OK (Cache-Control: private, no-store)" }
  /map/search/pins:
    get:
      summary: Tìm theo loại hình; tối đa 10 kết quả kèm tọa độ để ghim, bỏ kết quả ngoài radius
      x-permission: map:use
      x-rate-limit: 10/phút/người dùng (search-pins)
      parameters:
        - { name: text, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { name: lat, in: query, schema: { type: number, minimum: 8, maximum: 24 } }
        - { name: lng, in: query, schema: { type: number, minimum: 102, maximum: 110 } }
        - { name: radius, in: query, schema: { type: integer, minimum: 50, maximum: 50000 } }
        - { name: cats, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string } }
      responses:
        "200": { description: "Mảng MapPlace + refId + distanceM (mét tới tâm)" }
  /map/places/evaluation:
    get:
      summary: Lượt đánh giá gần nhất của CHÍNH người dùng tại điểm này (null nếu chưa bấm). Không tính toán, không tính phí
      x-permission: map:use
      x-rate-limit: 120/phút/người dùng (evaluation-read)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: 8, maximum: 24 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: 102, maximum: 110 } }
      responses:
        "200":
          description: OK (Cache-Control private, no-store)
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation: { nullable: true, allOf: [{ $ref: "#/components/schemas/PlaceEvaluation" }] }
                  currentDatasetVersion: { type: integer }
    post:
      summary: Bấm "Đánh giá" (fresh=false, nhận bản phân tích mới nhất của địa điểm; chưa có thì AI chạy) hoặc "Đánh giá lại" (fresh=true, AI luôn chạy)
      x-permission: map:use
      x-rate-limit: 30/phút/người dùng (evaluate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              additionalProperties: false
              properties:
                lat: { type: number, minimum: 8, maximum: 24 }
                lng: { type: number, minimum: 102, maximum: 110 }
                fresh: { type: boolean, default: false }
      responses:
        "201":
          description: OK (luôn tạo một lượt cho người bấm)
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation: { $ref: "#/components/schemas/PlaceEvaluation" }
                  source: { type: string, enum: [fresh, shared], description: fresh = AI chạy ở lượt này }
        "400": { description: Sai schema hoặc có trường lạ }
  /map/places/evaluation/criteria/{criterionId}:
    put:
      summary: Bỏ qua tiêu chí và/hoặc đặt điểm tay; trả về đánh giá đã tính lại
      x-permission: map:use
      parameters:
        - { name: criterionId, in: path, required: true, schema: { type: string, example: benh-vien } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                skipped: { type: boolean }
                score: { type: number, nullable: true, minimum: 0, maximum: 10, description: "Làm tròn bước 0,5; null = về điểm tự động" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlaceEvaluation" } } } }
        "404": { description: Tiêu chí không tồn tại, hoặc người dùng chưa có lượt đánh giá tại điểm này }
    delete:
      summary: Khôi phục tiêu chí về mặc định
      x-permission: map:use
      parameters:
        - { name: criterionId, in: path, required: true, schema: { type: string } }
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlaceEvaluation" } } } }
  /admin/map/dataset-versions:
    get:
      summary: Danh sách phiên bản dữ liệu đánh giá
      x-permission: admin:access
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DatasetVersion" } } } } }
    post:
      summary: Phát hành phiên bản mới = hiện hành + 1 (lượt cũ của người dùng không tự cập nhật)
      x-permission: admin:access
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, minLength: 3, maxLength: 500 } } } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } } }
        "403": { description: Không phải admin }
components:
  schemas:
    DatasetVersion:
      type: object
      properties:
        version: { type: integer }
        note: { type: string }
        releasedBy: { type: string, format: uuid, nullable: true }
        releasedAt: { type: string, format: date-time }
        current: { type: boolean }
    MapConfig:
      type: object
      properties:
        styles: { type: array, items: { type: object, properties: { id: { type: string, enum: [tm, lm, dm, hm] }, url: { type: string } } } }
        trafficStyleUrl: { type: string, nullable: true }
        center: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: "[lng,lat]" }
        zoom: { type: number }
        maxBounds: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        searchEnabled: { type: boolean }
        tilesEnabled: { type: boolean }
    MapSuggestion:
      type: object
      properties:
        refId: { type: string }
        name: { type: string }
        address: { type: string }
        addressOld: { type: string, nullable: true }
        display: { type: string }
        distanceKm: { type: number, nullable: true }
    MapPlace:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
        name: { type: string }
        address: { type: string }
        addressOld: { type: string, nullable: true }
        display: { type: string }
        distanceM: { type: number, nullable: true }
        kind: { type: string, enum: [poi, address, street, ward, district, city, village, unknown] }
        categories: { type: array, items: { type: string } }
    SavedPlace:
      type: object
      properties:
        id: { type: string, format: uuid }
        placeId: { type: string, format: uuid }
        lat: { type: number }
        lng: { type: number }
        name: { type: string }
        address: { type: string }
        kind: { type: string, nullable: true }
        label: { type: string, nullable: true, description: Tên gợi nhớ }
        note: { type: string }
        compared: { type: boolean }
        createdAt: { type: string, format: date-time }
        evaluation:
          nullable: true
          description: Tóm tắt lượt đánh giá gần nhất của chính người dùng
          type: object
          properties:
            overall: { type: number, nullable: true }
            rating: { type: string }
            datasetVersion: { type: integer }
            outdated: { type: boolean }
            evaluatedAt: { type: string, format: date-time }
    EvaluatedCriterion:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        group: { type: string, enum: [walk, move, health, env] }
        groupLabel: { type: string }
        verdict: { type: string, example: Xa }
        detail: { type: string, example: "Cách bệnh viện gần nhất 2,8 km" }
        source: { type: string }
        score: { type: number, minimum: 0, maximum: 10 }
        autoScore: { type: number }
        manual: { type: boolean }
        skipped: { type: boolean }
    PlaceEvaluation:
      type: object
      properties:
        placeKey: { type: string }
        lat: { type: number }
        lng: { type: number }
        sample: { type: boolean, description: true = số liệu minh họa }
        overall: { type: number, nullable: true }
        rating: { type: string }
        summary: { type: string }
        strengths: { type: object, properties: { points: { type: number }, items: { type: array, items: { $ref: "#/components/schemas/EvaluatedCriterion" } } } }
        weaknesses: { type: object, properties: { points: { type: number }, items: { type: array, items: { $ref: "#/components/schemas/EvaluatedCriterion" } } } }
        skipped: { type: array, items: { $ref: "#/components/schemas/EvaluatedCriterion" } }
        criteriaCount: { type: integer }
        placeId: { type: string, format: uuid, description: Địa điểm chuẩn hóa }
        source: { type: string, enum: [fresh, shared] }
        analyzedAt: { type: string, format: date-time, description: Lúc AI tạo bản phân tích }
        datasetVersion: { type: integer, description: Phiên bản dữ liệu của bản phân tích }
        currentDatasetVersion: { type: integer }
        outdated: { type: boolean, description: Đã có phiên bản mới hơn }
        evaluatedAt: { type: string, format: date-time }
    MapRoute:
      type: object
      properties:
        distanceM: { type: number }
        durationS: { type: number }
        bbox: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        geometry: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
        steps: { type: array, items: { type: object, properties: { text: { type: string }, distanceM: { type: number }, durationS: { type: number }, sign: { type: integer }, street: { type: string } } } }
        congestion: { type: array, nullable: true, items: { type: string, enum: [low, moderate, heavy, severe, unknown] } }
    MapUsage:
      type: object
      properties:
        date: { type: string, format: date }
        budget: { type: integer, description: 0 = không giới hạn }
        upstream: { type: object, additionalProperties: { type: integer } }
        cacheHits: { type: object, additionalProperties: { type: integer } }

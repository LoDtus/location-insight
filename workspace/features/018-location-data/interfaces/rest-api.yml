openapi: 3.0.3
info:
  title: Địa Thế — Dữ liệu nền và bản phát hành (018-location-data, GĐ1–2)
  version: 0.2.0
  description: |
    Tiền tố `/api/v1`. Envelope chung `{success,status,data,error}`; lỗi nghiệp vụ có `error.details.code`.
    Thay `POST /admin/map/dataset-versions` một bước của 013-map bằng luồng nháp → phát hành.
    `GET /admin/map/dataset-versions` giữ nguyên đường dẫn, thêm trường.
    Dựng phiên bản lớp, kiểm tra chất lượng và chạy điểm mẫu chạy bằng `tools/data` từ máy vận hành, không có endpoint.
    Định nghĩa tiêu chí nằm trong code (research.md Bản ghi 9), không có API sửa tiêu chí.
    Mọi route cần `admin:access` + CIDR admin sẵn có. Thao tác ghi vào nhật ký kiểm toán.
paths:
  /admin/map/dataset-versions:
    get:
      summary: Danh sách bản phát hành (mới nhất trước)
      x-permission: admin:access
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DatasetRelease" } } } } }
    post:
      summary: Tạo bản nháp, chép bảng kê từ bản hiện hành
      x-permission: admin:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, note]
              properties:
                kind: { type: string, enum: [data, criteria, hotfix] }
                note: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetReleaseDetail" } } } }
        "409": { description: Đã có một bản nháp (RELEASE_DRAFT_EXISTS) }
  /admin/map/dataset-versions/{version}:
    get:
      summary: Chi tiết — bảng kê lớp (so với bản hiện hành), kiểm tra của từng phiên bản lớp, tiêu chí đổi so với snapshot hiện hành
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/Version" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetReleaseDetail" } } } }
        "404": { description: Không có bản này }
    delete:
      summary: Bỏ bản nháp (status → abandoned)
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/Version" }]
      responses:
        "200": { description: OK }
        "409": { description: Không phải bản nháp (RELEASE_NOT_DRAFT) }
  /admin/map/dataset-versions/{version}/layers/{layerCode}:
    put:
      summary: Đặt phiên bản cho một lớp trong bản nháp (chỉ phiên bản ready)
      x-permission: admin:access
      parameters:
        - { $ref: "#/components/parameters/Version" }
        - { $ref: "#/components/parameters/LayerCode" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [layerVersionId], properties: { layerVersionId: { type: string, format: uuid } } } } }
      responses:
        "200": { description: OK }
        "409": { description: RELEASE_NOT_DRAFT / LAYER_NOT_READY / LAYER_MISMATCH (phiên bản không thuộc lớp này) }
    delete:
      summary: Bỏ lớp khỏi bản nháp
      x-permission: admin:access
      parameters:
        - { $ref: "#/components/parameters/Version" }
        - { $ref: "#/components/parameters/LayerCode" }
      responses:
        "200": { description: OK }
        "409": { description: RELEASE_NOT_DRAFT }
  /admin/map/dataset-versions/{version}/publish:
    post:
      summary: Phát hành — chạy kiểm tra mức bản, chụp CRITERIA vào criteria_snapshot, published trong một transaction
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/Version" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acceptWarnings: { type: string, maxLength: 500, description: Lý do chấp nhận cảnh báo; bắt buộc nếu có cảnh báo }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetRelease" } } } }
        "409": { description: RELEASE_NOT_DRAFT / RELEASE_BLOCKED (kèm danh sách kiểm tra fail, ví dụ CRITERIA_INPUT_MISSING, METHOD_UNSUPPORTED, SOURCE_BLOCKED) / WARNINGS_NOT_ACCEPTED }
  /admin/map/dataset-versions/{version}/withdraw:
    post:
      summary: Thu hồi bản đang hiện hành — tạo và phát hành ngay bản rollback từ baseVersion
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/Version" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, baseVersion]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                baseVersion: { type: integer, minimum: 1 }
      responses:
        "200": { description: OK — trả về bản rollback mới, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetRelease" } } } }
        "409": { description: NOT_CURRENT (chỉ thu hồi bản hiện hành) / BASE_LAYER_RETIRED (kèm danh sách lớp phải dựng lại bằng tools/data) / RELEASE_DRAFT_EXISTS }
  /admin/map/layers:
    get:
      summary: Danh sách lớp và phiên bản (status, số dòng, khác biệt, kiểm tra)
      x-permission: admin:access
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [building, ready, failed, retired] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LayerSummary" } } } } }
components:
  parameters:
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    LayerCode: { name: layerCode, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+\.[a-z0-9_]+$', maxLength: 60 } }
  schemas:
    DatasetRelease:
      type: object
      properties:
        version: { type: integer }
        kind: { type: string, enum: [data, criteria, rollback, hotfix] }
        status: { type: string, enum: [draft, published, withdrawn, abandoned] }
        baseVersion: { type: integer, nullable: true }
        note: { type: string }
        criteriaHash: { type: string, nullable: true }
        releasedBy: { type: string, format: uuid, nullable: true }
        releasedAt: { type: string, format: date-time, nullable: true }
        withdrawnAt: { type: string, format: date-time, nullable: true }
        current: { type: boolean }
    DatasetReleaseDetail:
      allOf:
        - $ref: "#/components/schemas/DatasetRelease"
        - type: object
          properties:
            layers:
              type: array
              items:
                type: object
                properties:
                  layerCode: { type: string }
                  layerVersionId: { type: string, format: uuid }
                  label: { type: string }
                  changedFromCurrent: { type: boolean }
                  diffSummary: { type: object }
                  warnings: { type: array, items: { type: string } }
            criteriaChanged:
              type: array
              description: Tiêu chí trong code khác snapshot của bản hiện hành (thêm, bỏ, đổi tham số)
              items: { type: object, properties: { criterionId: { type: string }, change: { type: string, enum: [added, removed, changed] } } }
    LayerSummary:
      type: object
      properties:
        code: { type: string }
        geometryKind: { type: string, enum: [point, line, area, grid] }
        usage: { type: string, enum: [public, internal, blocked] }
        versions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              status: { type: string, enum: [building, ready, failed, retired] }
              rowCount: { type: integer }
              diffSummary: { type: object }
              checks: { type: array, items: { type: object, properties: { code: { type: string }, severity: { type: string, enum: [blocking, warning] }, status: { type: string, enum: [pass, fail] } } } }
              inReleases: { type: array, items: { type: integer } }

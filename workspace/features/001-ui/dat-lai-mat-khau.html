    <main id="noi-dung" class="auth-shell">
      <figure class="auth-aside">
        <img src="images/noi-bai.webp" width="1280" height="886" alt="Sân bay Nội Bài nhìn từ xa." />
        <figcaption>Sân bay Nội Bài. Shyamal, Wikimedia Commons, CC BY-SA 4.0.</figcaption>
      </figure>
      <div class="auth-main">
        <div class="auth-card">
          <h1>Đặt mật khẩu mới</h1>
          <p class="lede">Liên kết này là mẫu trong bản mock. Mật khẩu mới có hiệu lực khi bạn đăng nhập lại trên trình duyệt này.</p>
          <form id="form-reset" class="form-stack" novalidate>
            <div class="field">
              <label for="password">Mật khẩu mới</label>
              <div class="password-row">
                <input id="password" name="password" type="password" autocomplete="new-password" required />
                <button class="icon-btn" type="button" data-toggle-password="password" aria-label="Hiện mật khẩu"><i data-lucide="eye"></i></button>
              </div>
              <p class="help">Ít nhất 8 ký tự.</p>
            </div>
            <div class="field">
              <label for="again">Nhập lại mật khẩu mới</label>
              <input id="again" name="again" type="password" autocomplete="new-password" required />
            </div>
            <button class="btn btn-primary" type="submit">Lưu mật khẩu và về đăng nhập</button>
          </form>
          <p><a href="quen-mat-khau.html">Gửi lại liên kết</a></p>
        </div>
      </div>
    </main>

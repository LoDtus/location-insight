name: location-insight-dev

services:
  website:
    container_name: location-insight-website
    restart: unless-stopped
    build:
      context: ../website
      dockerfile: Dockerfile
      target: development
    env_file:
      - ../.env.development
    ports:
      - "${WEBSITE_PORT:?WEBSITE_PORT is required}:${WEBSITE_PORT:?WEBSITE_PORT is required}"
    environment:
      NODE_ENV: development
      PORT: ${WEBSITE_PORT:?WEBSITE_PORT is required}
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
      TZ: UTC
      API_PROXY_TARGET: http://backend:${BACKEND_PORT:?BACKEND_PORT is required}
    volumes:
      - ../website:/app
      - website_node_modules:/app/node_modules
      - website_next:/app/.next
    stdin_open: true
    tty: true

  postgres:
    container_name: location-insight-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: location-insight-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: UTC
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    container_name: location-insight-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    restart: unless-stopped
    environment:
      TZ: UTC
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ingest.geoip.downloader.enabled: "false"
      cluster.name: location-insight
    ports:
      - "${ELASTICSEARCH_PORT:?ELASTICSEARCH_PORT is required}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  minio:
    container_name: location-insight-minio
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      TZ: UTC
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:?S3_BUCKET is required}
    ports:
      - "${MINIO_API_PORT:?MINIO_API_PORT is required}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    container_name: location-insight-backend
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    env_file:
      - ../.env.development
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required}:${BACKEND_PORT:?BACKEND_PORT is required}"
    environment:
      TZ: UTC
      NODE_ENV: development
      PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      TSC_WATCHFILE: UsePolling
      TSC_WATCHDIRECTORY: UsePolling
      WATCHPACK_POLLING: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  website_node_modules:
  website_next:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  backend_node_modules:
  backend_dist:

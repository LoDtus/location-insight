openapi: 3.0.3
info:
  title: Địa Thế — Dữ liệu nền và bản phát hành (018-location-data, GĐ1–2)
  version: 0.3.0
  description: |
    Tiền tố `/api/v1`. Envelope chung `{success,status,data,error}`; lỗi nghiệp vụ có `error.details.code`.
    Thay `POST /admin/map/dataset-versions` một bước của 013-map bằng luồng nháp → phát hành.
    `GET /admin/map/dataset-versions` giữ nguyên đường dẫn, thêm trường.
    Một đường ghi duy nhất (research.md Bản ghi 12): mọi phiên bản lớp sinh từ một gói chuẩn (package-contracts.md)
    tải lên qua `/admin/map/imports` → kiểm tra trong staging → admin Lưu. Gói đi thẳng lên kho S3 bằng URL ký sẵn
    (proxy website giới hạn kích thước body), backend tải về kiểm và lưu gói theo sha256. `tools/data` chỉ sinh và kiểm gói ở máy, không ghi database.
    Điểm mẫu chạy tự động lúc phát hành (Bản ghi 14).
    Trang UI: `/admin/datasets`.
    Định nghĩa tiêu chí nằm trong code (research.md Bản ghi 9), không có API sửa tiêu chí.
    Mọi route cần `admin:access` + CIDR admin sẵn có. Thao tác ghi vào nhật ký kiểm toán.
paths:
  /admin/map/dataset-versions:
    get:
      summary: Danh sách bản phát hành (mới nhất trước)
      x-permission: admin:access
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DatasetRelease" } } } } }
    post:
      summary: Tạo bản nháp, chép bảng kê từ bản hiện hành
      x-permission: admin:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, note]
              properties:
                kind: { type: string, enum: [data, criteria, hotfix] }
                note: { type: string, minLength: 3, maxLength: 500 }
              additionalProperties: false
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetReleaseDetail" } } } }
        "409": { description: Đã có một bản nháp (RELEASE_DRAFT_EXISTS) }
  /admin/map/dataset-versions/{version}:
    get:
      summary: Chi tiết — bảng kê lớp (so với bản hiện hành), kiểm tra của từng phiên bản lớp, tiêu chí đổi so với snapshot hiện hành
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/Version" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetReleaseDetail" } } } }
        "404": { description: Không có bản này }
    delete:
      summary: Bỏ bản nháp (status → abandoned)
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/Version" }]
      responses:
        "200": { description: OK }
        "409": { description: Không phải bản nháp (RELEASE_NOT_DRAFT) }
  /admin/map/dataset-versions/{version}/layers/{layerCode}:
    put:
      summary: Đặt phiên bản cho một lớp trong bản nháp (chỉ phiên bản ready)
      x-permission: admin:access
      parameters:
        - { $ref: "#/components/parameters/Version" }
        - { $ref: "#/components/parameters/LayerCode" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [layerVersionId], properties: { layerVersionId: { type: string, format: uuid } } } } }
      responses:
        "200": { description: OK }
        "409": { description: RELEASE_NOT_DRAFT / LAYER_NOT_READY / LAYER_MISMATCH (phiên bản không thuộc lớp này) }
    delete:
      summary: Bỏ lớp khỏi bản nháp
      x-permission: admin:access
      parameters:
        - { $ref: "#/components/parameters/Version" }
        - { $ref: "#/components/parameters/LayerCode" }
      responses:
        "200": { description: OK }
        "409": { description: RELEASE_NOT_DRAFT }
  /admin/map/dataset-versions/{version}/publish:
    post:
      summary: Phát hành — chạy kiểm tra mức bản, chụp CRITERIA vào criteria_snapshot, published trong một transaction
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/Version" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acceptWarnings: { type: string, maxLength: 500, description: Lý do chấp nhận cảnh báo; bắt buộc nếu có cảnh báo }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetRelease" } } } }
        "409": { description: "RELEASE_NOT_DRAFT / RELEASE_BLOCKED (kèm checks: layers_ready, integrity, source_blocked; GĐ sau thêm criteria_inputs_present, method_supported, golden_points) / WARNINGS_NOT_ACCEPTED (cảnh báo layers_present khi bảng kê rỗng)" }
  /admin/map/dataset-versions/{version}/withdraw:
    post:
      summary: Thu hồi bản đang hiện hành — tạo và phát hành ngay bản rollback từ baseVersion
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/Version" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, baseVersion]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                baseVersion: { type: integer, minimum: 1 }
      responses:
        "200": { description: OK — trả về bản rollback mới, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetRelease" } } } }
        "409": { description: "NOT_CURRENT (chỉ thu hồi bản hiện hành) / BASE_INVALID / BASE_LAYER_RETIRED (kèm danh sách phiên bản lớp cần khôi phục) / RELEASE_DRAFT_EXISTS" }
  /admin/map/layers:
    get:
      summary: Danh sách lớp và phiên bản (status, số dòng, khác biệt, kiểm tra, toàn vẹn)
      x-permission: admin:access
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [building, ready, retired] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LayerSummary" } } } } }
    post:
      summary: Tạo lớp mới (không cần code nếu cùng dạng hình học đã có khuôn)
      x-permission: admin:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, geometryKind, contract, sourceCode, usage, attribution]
              additionalProperties: false
              properties:
                code: { type: string, pattern: '^[a-z0-9-]+\.[a-z0-9_]+$', maxLength: 60 }
                geometryKind: { type: string, enum: [point, line, area, grid] }
                contract: { type: string, enum: ["point@1", "line@1", "area@1", "grid@1"] }
                sourceCode: { type: string, pattern: '^[a-z0-9-]{2,40}$' }
                usage: { type: string, enum: [public, internal] }
                attribution: { type: string, maxLength: 300 }
                description: { type: string, maxLength: 300 }
      responses:
        "201": { description: OK }
        "409": { description: "LAYER_EXISTS / CONTRACT_KIND_MISMATCH / CONTRACT_UNSUPPORTED" }
  /admin/map/layers/{layerCode}:
    patch:
      summary: Sửa usage, attribution, description. Đổi sang blocked thì mọi bản nháp và bản hiện hành dùng lớp phải xử lý theo tình huống 16 (playbook)
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/LayerCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                usage: { type: string, enum: [public, internal, blocked] }
                attribution: { type: string, maxLength: 300 }
                description: { type: string, maxLength: 300 }
                reason: { type: string, minLength: 3, maxLength: 500, description: Bắt buộc khi đổi usage }
      responses:
        "200": { description: OK }
        "404": { description: Không có lớp này }
  /admin/map/layer-versions/{layerVersionId}/restore:
    post:
      summary: "[GĐ2, chưa có code] Khôi phục phiên bản retired từ gói trong kho (tạo import job purpose = restore; giữ nguyên id phiên bản)"
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/LayerVersionId" }]
      responses:
        "202": { description: Đã xếp hàng, content: { application/json: { schema: { $ref: "#/components/schemas/ImportJob" } } } }
        "409": { description: "NOT_RETIRED / PACKAGE_MISSING (gói không còn trong kho: nạp lại từ bản sao lưu) / PACKAGE_CHECKSUM_MISMATCH / IMPORT_BUSY" }
  /admin/map/imports:
    get:
      summary: Danh sách job nhập (mới nhất trước)
      x-permission: admin:access
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ImportStatus" } }
        - { name: layerCode, in: query, schema: { type: string, pattern: '^[a-z0-9-]+\.[a-z0-9_]+$', maxLength: 60 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ImportJob" } } } } }
    post:
      summary: Nộp gói đã PUT lên kho theo phiếu. Kiểm hình dạng zip và manifest, lưu gói theo sha256, xếp hàng kiểm tra ở nền
      description: |
        Lớp lấy từ manifest. Kiểm tra theo package-contracts.md mục 5. Phiếu dùng một lần, đúng admin đã xin phiếu.
        Chỉ một job ở validating/saving cùng lúc (khóa advisory).
      x-permission: admin:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId]
              additionalProperties: false
              properties:
                uploadId: { type: string, format: uuid }
      responses:
        "202": { description: Đã nhận, content: { application/json: { schema: { $ref: "#/components/schemas/ImportJob" } } } }
        "404": { description: UPLOAD_NOT_FOUND (phiếu hết hạn hoặc không phải của admin này) }
        "409": { description: "PACKAGE_DUPLICATE (đã nhập gói cùng sha256) / LABEL_EXISTS" }
        "413": { description: PACKAGE_TOO_LARGE (vượt 200 MB hoặc khác kích thước khai trong phiếu) }
        "422": { description: "UPLOAD_MISSING / PACKAGE_SHAPE_INVALID / MANIFEST_INVALID (kèm errors) / LAYER_UNKNOWN / LAYER_BLOCKED / CONTRACT_MISMATCH" }
  /admin/map/imports/upload-tickets:
    post:
      summary: Xin phiếu tải lên — URL ký sẵn (PUT, 10 phút) tới datasets/incoming/{uploadId}.zip
      x-permission: admin:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sizeBytes]
              additionalProperties: false
              properties:
                sizeBytes: { type: integer, minimum: 1, maximum: 209715200 }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId: { type: string, format: uuid }
                  url: { type: string }
                  method: { type: string, enum: [PUT] }
                  headers: { type: object, additionalProperties: { type: string } }
                  expiresAt: { type: string, format: date-time }
                  maxBytes: { type: integer }
        "413": { description: PACKAGE_TOO_LARGE }
  /admin/map/imports/{jobId}:
    get:
      summary: Chi tiết job — trạng thái, kiểm tra, khác biệt so với bản hiện hành, mẫu 20 dòng đầu, số đối tượng theo category
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ImportJob" } } } }
        "404": { description: Không có job này }
  /admin/map/imports/{jobId}/save:
    post:
      summary: Lưu — chép staging sang geo trong một transaction, tính content_hash, phiên bản lớp ready
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                acceptWarnings: { type: string, maxLength: 500, description: Lý do chấp nhận cảnh báo; bắt buộc nếu có cảnh báo }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ImportJob" } } } }
        "409": { description: "IMPORT_NOT_VALIDATED / IMPORT_BLOCKED (có kiểm tra chặn fail) / WARNINGS_NOT_ACCEPTED / SOURCE_BLOCKED / IMPORT_BUSY" }
        "500": { description: IMPORT_SAVE_FAILED (transaction lùi lại, dữ liệu nền không đổi) }
  /admin/map/imports/{jobId}/discard:
    post:
      summary: Bỏ (uploaded, validated, rejected, failed) — xóa staging; gói trong kho xóa sau 30 ngày
      x-permission: admin:access
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: OK }
        "409": { description: IMPORT_NOT_DISCARDABLE (đang chạy hoặc đã lưu) }
components:
  parameters:
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    LayerCode: { name: layerCode, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+\.[a-z0-9_]+$', maxLength: 60 } }
    LayerVersionId: { name: layerVersionId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    DatasetRelease:
      type: object
      properties:
        version: { type: integer }
        kind: { type: string, enum: [data, criteria, rollback, hotfix] }
        status: { type: string, enum: [draft, published, withdrawn, abandoned] }
        baseVersion: { type: integer, nullable: true }
        note: { type: string }
        criteriaHash: { type: string, nullable: true }
        backendCommit: { type: string, nullable: true }
        releasedBy: { type: string, format: uuid, nullable: true }
        releasedAt: { type: string, format: date-time, nullable: true }
        withdrawnAt: { type: string, format: date-time, nullable: true }
        current: { type: boolean }
    DatasetReleaseDetail:
      allOf:
        - $ref: "#/components/schemas/DatasetRelease"
        - type: object
          properties:
            layers:
              type: array
              items:
                type: object
                properties:
                  layerCode: { type: string }
                  layerVersionId: { type: string, format: uuid }
                  label: { type: string }
                  changedFromCurrent: { type: boolean }
                  diffSummary: { type: object }
                  warnings: { type: array, items: { type: string } }
            checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
            goldenReport:
              type: object
              nullable: true
              description: Điểm mẫu tự chạy lúc phát hành
              properties:
                points: { type: integer }
                verdictFlips: { type: integer }
                violations: { type: array, items: { type: object, properties: { pointId: { type: string }, criterionId: { type: string }, expected: { type: string }, observed: { type: string } } } }
                scoreDeltaByCriterion: { type: object, additionalProperties: { type: number } }
            criteriaChanged:
              type: array
              description: Tiêu chí trong code khác snapshot của bản hiện hành (thêm, bỏ, đổi tham số)
              items: { type: object, properties: { criterionId: { type: string }, change: { type: string, enum: [added, removed, changed, method_version] } } }
    LayerSummary:
      type: object
      properties:
        code: { type: string }
        geometryKind: { type: string, enum: [point, line, area, grid] }
        contract: { type: string }
        usage: { type: string, enum: [public, internal, blocked] }
        versions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              status: { type: string, enum: [building, ready, retired] }
              rowCount: { type: integer }
              packageSha256: { type: string }
              packageAvailable: { type: boolean, description: Gói còn trong kho (khôi phục được) }
              integrityOk: { type: boolean, nullable: true }
              integrityCheckedAt: { type: string, format: date-time, nullable: true }
              diffSummary: { type: object }
              checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
              inReleases: { type: array, items: { type: integer } }
    Check:
      type: object
      properties:
        code: { type: string }
        severity: { type: string, enum: [blocking, warning] }
        status: { type: string, enum: [pass, fail] }
        expected: { type: string }
        observed: { type: string }
    ImportStatus:
      type: string
      enum: [uploaded, validating, validated, rejected, saving, saved, discarded, failed]
    ImportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        layerCode: { type: string }
        label: { type: string }
        contract: { type: string }
        purpose: { type: string, enum: [new, restore] }
        status: { $ref: "#/components/schemas/ImportStatus" }
        packageSha256: { type: string }
        sizeBytes: { type: integer }
        manifest: { type: object, nullable: true }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        diffSummary: { type: object, nullable: true }
        preview: { type: array, items: { type: object }, description: 20 dòng đầu sau chuẩn hóa (không có cho lớp internal ngoài admin) }
        error: { type: string, nullable: true }
        uploadedBy: { type: string, format: uuid }
        decidedBy: { type: string, format: uuid, nullable: true }
        layerVersionId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
